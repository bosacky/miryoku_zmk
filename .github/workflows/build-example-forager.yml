name: 'Build Example Forager'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["xiao_ble//zmk"]'
      shield: '["forager_left rgbled_adapter", "forager_right rgbled_adapter"]'
      alphas: '["COLEMAKDH"]'
